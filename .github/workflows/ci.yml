name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Supersede in-flight runs for the same ref — except on main, where a run may be
# in the middle of deploying.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  # The pinned browser runtime (see scripts/fetch-runtime.mjs). Cached below so
  # only the first run of a given release pays the 277 MB download.
  LEAN_RUNTIME_RELEASE: runtime-62b6a22-compact1

jobs:
  unit:
    name: unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - name: Restore the pinned Lean runtime
        uses: actions/cache@v6
        with:
          path: .runtime-cache
          key: lean-runtime-${{ env.LEAN_RUNTIME_RELEASE }}
      - name: Fetch and pack the runtime
        run: npm run prepare:runtime
      - name: Build the static site
        run: npm run build
      - name: Check the output has what Pages needs
        run: |
          set -euo pipefail
          test -f dist/index.html
          test -f dist/_headers
          test -f dist/lean-worker.worker.js
          test -f dist/src/lean/config.js
          grep -q "Cross-Origin-Embedder-Policy" dist/_headers
          # Nothing may exceed Cloudflare Pages' 25 MB per-file limit.
          big=$(find dist -type f -size +25M)
          if [ -n "$big" ]; then echo "::error::these files exceed Pages' per-file limit: $big"; exit 1; fi
          echo "dist/ complete: $(du -sh dist | cut -f1), largest file $(find dist -type f -printf '%s %p\n' | sort -rn | head -1)"
      - name: Check the staged runtime matches the pinned release
        run: |
          set -euo pipefail
          node -e '
            const { createHash } = require("node:crypto");
            const { readFileSync } = require("node:fs");
            const runtime = JSON.parse(readFileSync("dist/lean-wasm/runtime.json", "utf8"));
            const parts = runtime.wasm.chunks.map((name) => readFileSync(`dist/lean-wasm/${name}`));
            const digest = createHash("sha256").update(Buffer.concat(parts)).digest("hex");
            if (digest !== runtime.wasm.sha256) throw new Error(`assembled wasm digest ${digest} != ${runtime.wasm.sha256}`);
            if (runtime.variant !== 'full') throw new Error(`expected the full runtime variant, staged ${runtime.variant}`);
            console.log(`wasm chunks reassemble to ${digest.slice(0, 16)}… (${runtime.wasm.bytes} bytes, variant ${runtime.variant})`);
          '

  browser:
    name: browser tests (real Lean kernel)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      # Must match the playwright-core version pinned in package-lock.json, or
      # the tests will not find the browser build it expects.
      - name: Install Chromium
        run: npx --yes playwright@1.63.0 install --with-deps chromium
      - name: Restore the pinned Lean runtime
        uses: actions/cache@v6
        with:
          path: .runtime-cache
          key: lean-runtime-${{ env.LEAN_RUNTIME_RELEASE }}
      - name: Fetch and pack the runtime
        run: npm run prepare:runtime
      - name: Build the static site
        run: npm run build
      - name: Mobile geometry (no overflow, tap targets, sticky actions)
        run: node tests/layout.mjs
      - name: Contrast in light and dark mode
        run: node tests/a11y-contrast.mjs
      - name: Boot Lean WASM, check every lesson, and prove repeat visits cost nothing
        run: node tests/browser-check.mjs --mem 2048 --fresh

  deploy:
    name: deploy to Cloudflare Pages
    needs: [unit, browser]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      # Always gate on the stable production hostname. The per-deployment alias
      # (https://<hash>.lean-tutorials.pages.dev) takes a minute or two to get its
      # certificate, so smoke-testing it right after a deploy fails on a deploy
      # that is actually fine.
      SITE_URL: https://lean-tutorials.pages.dev
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Restore the pinned Lean runtime
        uses: actions/cache@v6
        with:
          path: .runtime-cache
          key: lean-runtime-${{ env.LEAN_RUNTIME_RELEASE }}
      - name: Fetch and pack the runtime
        run: npm run prepare:runtime
      - run: npm run build
      - name: Deploy
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID}" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID repository secrets are not set"
            exit 1
          fi
          npx --yes wrangler@4 pages deploy dist \
            --project-name lean-tutorials \
            --branch main \
            --commit-hash "${GITHUB_SHA}" \
            --commit-message "${GITHUB_SHA:0:7} by ${GITHUB_ACTOR}" \
            --commit-dirty=true | tee /tmp/deploy.log
          url=$(grep -oE 'https://[a-z0-9.-]+\.pages\.dev' /tmp/deploy.log | tail -1)
          echo "url=${url}" >> "$GITHUB_OUTPUT"
          {
            echo "### Deployed to Cloudflare Pages"
            echo
            echo "- production: $SITE_URL"
            echo "- this deployment: ${url}"
            echo "- commit: \`${GITHUB_SHA:0:7}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Smoke test the deployment
        run: |
          set -euo pipefail
          url="$SITE_URL"
          status() { curl -s -o /dev/null -w '%{http_code}' --max-time 30 "$1"; }

          # A brand-new deployment takes a moment to answer everywhere (cold
          # Function start, edge propagation), and so does a new 404.html, so each
          # assertion is retried as a set instead of firing once.
          ok=false
          for attempt in 1 2 3 4 5 6; do
            echo "--- attempt $attempt ---"
            if [ "$(status "$url/")" != "200" ]; then echo "index -> $(status "$url/")"; sleep 10; continue; fi
            headers=$(curl -sI "$url/")
            grep -qi 'cross-origin-opener-policy: same-origin' <<< "$headers" || { echo "missing COOP"; sleep 10; continue; }
            grep -qi 'cross-origin-embedder-policy: require-corp' <<< "$headers" || { echo "missing COEP"; sleep 10; continue; }
            if [ "$(status "$url/lean-wasm/lean.wasm?v=../x")" != "400" ]; then echo "invalid ?v= not rejected"; sleep 10; continue; fi
            if [ "$(status "$url/lean-wasm/not-a-runtime-file.pack")" != "404" ]; then echo "unknown runtime path is not 404"; sleep 10; continue; fi
            curl -sf --max-time 60 -o /dev/null "$url/lean-wasm/core-layer.json" || { echo "core-layer.json not served"; sleep 10; continue; }
            curl -sf --max-time 60 -o /dev/null "$url/lean-wasm/core-lib/artifacts-000.pack" || { echo "core pack not served"; sleep 10; continue; }
            ok=true
            break
          done
          if [ "$ok" != "true" ]; then
            echo "::error::$url did not pass the smoke test after 6 attempts"
            exit 1
          fi
          echo "smoke test passed for $url"

      # The runtime must arrive compressed: an uncompressed ~96 MB body exceeds
      # Chromium's per-entry cache limit, so it would be re-downloaded every visit.
      # (tests/cache-check.mjs below is the end-to-end version of this assertion.)
      - name: Check the runtime is served compressed
        run: |
          set -euo pipefail
          version=$(node -e "import('./site/src/lean/config.js').then(m => process.stdout.write(m.LEAN_ASSET_VERSION))")
          headers=$(curl -sI -H 'Accept-Encoding: br, gzip' "$SITE_URL/lean-wasm/lean.wasm?v=$version")
          echo "$headers" | grep -i 'content-type: application/wasm' || { echo "::error::the runtime is not served as wasm"; exit 1; }
          echo "$headers" | grep -i 'content-encoding: br' || { echo "::error::lean.wasm is not brotli-compressed, so browsers will refuse to cache it"; exit 1; }
          echo "lean.wasm is wasm + brotli"

      - name: Install Chromium
        run: npx --yes playwright@1.63.0 install --with-deps chromium

      # The gate that matters: the real browser test suite against the deployed
      # origin, then the cache test.
      - name: Check every lesson against the deployed site
        run: node tests/browser-check.mjs --url "$SITE_URL" --mem 2048 --fresh

      - name: Confirm a repeat visit re-downloads nothing
        run: node tests/cache-check.mjs --url "$SITE_URL"

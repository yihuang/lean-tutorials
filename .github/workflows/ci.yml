      - name: Install Chromium
        run: npx --yes playwright@1.63.0 install --with-deps chromium

      # The gate that matters: the real browser test suite against the deployed
      # origin, then the cache test.
      - name: Check every lesson against the deployed site
        run: node tests/browser-check.mjs --url "${{ steps.deploy.outputs.url }}" --mem 2048 --fresh

      - name: Confirm a repeat visit re-downloads nothing
        run: node tests/cache-check.mjs --url "${{ steps.deploy.outputs.url }}"

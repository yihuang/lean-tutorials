name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Supersede in-flight runs for the same ref — except on main, where a run may be
# in the middle of deploying.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  unit:
    name: unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - name: Build the static site
        run: npm run build
      - name: Check the output has what Pages needs
        run: |
          set -euo pipefail
          test -f dist/index.html
          test -f dist/_headers
          test -f dist/lean-worker.worker.js
          test -f dist/src/lean/config.js
          grep -q "Cross-Origin-Embedder-Policy" dist/_headers
          echo "dist/ looks complete"

  browser:
    name: browser tests (real Lean kernel)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      # Must match the playwright-core version pinned in package-lock.json, or
      # the tests will not find the browser build it expects.
      - name: Install Chromium
        run: npx --yes playwright@1.63.0 install --with-deps chromium
      - name: Build the static site
        run: npm run build
      - name: Mobile geometry (no overflow, tap targets, sticky actions)
        run: node tests/layout.mjs
      - name: Contrast in light and dark mode
        run: node tests/a11y-contrast.mjs
      - name: Check the upstream runtime is reachable from this runner
        id: upstream
        run: |
          set -euo pipefail
          version=$(node -e "import('./site/src/lean/config.js').then(m => process.stdout.write(m.LEAN_ASSET_VERSION))")
          # Through our own proxy, so this exercises the exact path the test uses:
          # Node's fetch, from this runner's IP, validated for content type.
          node scripts/serve.mjs --dir site --port 8791 >/tmp/probe.log 2>&1 &
          probe=$!
          sleep 2
          ok=false
          if curl -sf --max-time 45 -o /dev/null "http://localhost:8791/lean-wasm/lean.js?v=$version" \
             && curl -sfI --max-time 45 "http://localhost:8791/lean-wasm/lean.wasm?v=$version" | grep -qi 'application/wasm'; then
            ok=true
          fi
          kill $probe 2>/dev/null || true
          cat /tmp/probe.log
          if [ "$ok" = "true" ]; then
            echo "reachable=true" >> "$GITHUB_OUTPUT"
          else
            echo "reachable=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Upstream runtime unreachable::lean.cau.li did not serve the pinned runtime to this runner."
            echo "Cloudflare's bot protection challenges datacenter IP ranges, so the local Lean boot test cannot run here."
            echo "The deploy job still smoke-tests the deployed origin, which fetches upstream from Cloudflare's edge."
          fi
      - name: Boot Lean WASM and check every lesson
        if: steps.upstream.outputs.reachable == 'true'
        run: node tests/browser-check.mjs --mem 2048
      - name: Re-run to prove a repeat visit re-downloads nothing
        if: steps.upstream.outputs.reachable == 'true'
        run: node tests/cache-check.mjs
      - name: Note the skipped runtime test
        if: steps.upstream.outputs.reachable != 'true'
        run: |
          {
            echo "### Lean boot test skipped"
            echo
            echo "This runner could not reach the upstream runtime (likely bot protection on datacenter IPs)."
            echo "Mobile geometry and contrast were still checked, and the deploy job smoke-tests production."
            echo "Run \`npm run test:e2e\` locally, or point the app at a self-hosted runtime."
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: deploy to Cloudflare Pages
    needs: [unit, browser]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      # Always gate on the stable production hostname. The per-deployment alias
      # (https://<hash>.lean-tutorials.pages.dev) takes a minute or two to get its
      # certificate, so smoke-testing it immediately after a deploy fails on a
      # deploy that is actually fine.
      SITE_URL: https://lean-tutorials.pages.dev
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Deploy
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID}" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID repository secrets are not set"
            exit 1
          fi
          npx --yes wrangler@4 pages deploy dist \
            --project-name lean-tutorials \
            --branch main \
            --commit-hash "${GITHUB_SHA}" \
            --commit-message "${GITHUB_SHA:0:7} by ${GITHUB_ACTOR}" \
            --commit-dirty=true | tee /tmp/deploy.log
          url=$(grep -oE 'https://[a-z0-9.-]+\.pages\.dev' /tmp/deploy.log | tail -1)
          echo "url=${url}" >> "$GITHUB_OUTPUT"
          {
            echo "### Deployed to Cloudflare Pages"
            echo
            echo "- production: $SITE_URL"
            echo "- this deployment: ${url}"
            echo "- commit: \`${GITHUB_SHA:0:7}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Install Chromium
        run: npx --yes playwright@1.63.0 install --with-deps chromium

      - name: Smoke test the deployment
        run: |
          set -euo pipefail
          url="$SITE_URL"
          test -n "${url}" || { echo "::error::no deployment URL"; exit 1; }
          status() { curl -s -o /dev/null -w '%{http_code}' --max-time 30 "$1"; }

          # The very first request to a brand-new deployment can hit a cold start.
          ready=false
          for attempt in 1 2 3 4 5 6; do
            if [ "$(status "$url/")" = "200" ]; then
              echo "ready after attempt $attempt"
              ready=true
              break
            fi
            echo "attempt $attempt: index $(status "$url/")"
            sleep 10
          done
          if [ "$ready" != "true" ]; then
            echo "::error::$url never became ready"
            exit 1
          fi

          headers=$(curl -sI "$url/")
          grep -qi 'cross-origin-opener-policy: same-origin' <<< "$headers" || { echo "::error::missing Cross-Origin-Opener-Policy"; exit 1; }
          grep -qi 'cross-origin-embedder-policy: require-corp' <<< "$headers" || { echo "::error::missing Cross-Origin-Embedder-Policy"; exit 1; }
          code=$(status "$url/lean-wasm/lean.js?v=../x")
          [ "$code" = "400" ] || { echo "::error::an invalid ?v= returned $code, expected 400"; exit 1; }
          echo "smoke test passed for $url"

      # Informational: the runtime proxy depends on upstream's edge answering our
      # edge. Print everything needed to diagnose it, but let the browser test
      # below be the gate — it reports *why* the runtime did not load.
      - name: Probe the runtime proxy
        run: |
          set -uo pipefail
          url="$SITE_URL"
          code=$(curl -s -o /tmp/runtime.out -D /tmp/runtime.headers -w '%{http_code}' --max-time 60 "$url/lean-wasm/core-layer.json")
          echo "core-layer.json -> $code"
          grep -i -E '^(cf-ray|x-upstream-status|cache-control|content-type)' /tmp/runtime.headers | tr -d '\r' || true
          echo "first 200 bytes: $(head -c 200 /tmp/runtime.out | tr '\n' ' ')"
          curl -sI --max-time 60 "$url/lean-wasm/lean.wasm" | grep -i 'content-type' | tr -d '\r' || true

      # The gate that matters: run the real browser tests against the deployed
      # origin. The runtime comes through Cloudflare's edge here, so this works
      # even when the runner's own IP is challenged by upstream.
      - name: Check every lesson against the deployed site
        run: node tests/browser-check.mjs --url "$SITE_URL" --mem 2048 --fresh

      - name: Confirm a repeat visit re-downloads nothing
        run: node tests/cache-check.mjs --url "$SITE_URL"
